<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi esposa linda</title>
    <style>
        /* Fondo rosado pastel y letra cursiva */
        body {
            background-color: #ffd1dc; 
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            position: relative; 
        }

        /* Letras BLANCAS con resplandor NEÓN FUCSIA INTENSO */
        #mensaje-central {
            color: #ffffff; 
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff007f, 0 0 40px #ff007f, 0 0 80px #ff007f, 0 0 120px #ff007f;
            text-align: center;
            position: absolute;
            width: 100%;
            left: 0;
            top: 25%;
            font-size: 2.5rem; 
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Corazón flechado que se mueve lento */
        #corazon-movil {
            font-size: 60px;
            position: absolute;
            cursor: pointer;
            animation: flotar 10s infinite alternate ease-in-out; 
            z-index: 20;
            user-select: none;
        }

        @keyframes flotar {
            0% { top: 40%; left: 10%; transform: scale(1) rotate(-5deg); }
            25% { top: 60%; left: 40%; transform: scale(1.1) rotate(5deg); }
            50% { top: 50%; left: 70%; transform: scale(0.9) rotate(-5deg); }
            75% { top: 70%; left: 50%; transform: scale(1.1) rotate(5deg); }
            100% { top: 35%; left: 80%; transform: scale(1) rotate(0deg); }
        }

        /* EL CENTRO EXACTO DE LA PANTALLA para el corazón final */
        #centro-pantalla {
            position: absolute;
            top: 50%; 
            left: 50%; 
            width: 0;
            height: 0;
            z-index: 5;
        }

        /* Diseño de la palabra "la amo" (Letra blanca con Neón Fucsia Intenso) */
        .palabra-amor {
            position: absolute;
            color: #ffffff; 
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff007f, 0 0 40px #ff007f, 0 0 60px #ff007f; 
            font-size: 1.1rem; 
            font-family: Arial, sans-serif; 
            font-weight: bold;
            animation: girar 4s linear infinite; 
            white-space: nowrap;
        }

        @keyframes girar {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ESTILO PARA LOS TIBURONES NEÓN */
        .tiburon-neon {
            position: absolute;
            font-size: 40px; /* Tamaño del tiburón */
            color: #ffffff; /* Letra blanca para el cuerpo del tiburón */
            text-shadow: 0 0 5px #fff, 0 0 10px #66ccff, 0 0 20px #00aaff, 0 0 30px #00aaff; /* Neón azul */
            animation: nadar 15s infinite alternate ease-in-out; /* Animación de nado */
            opacity: 0; /* Empiezan invisibles */
            z-index: 1; /* Detrás del resto del contenido */
            pointer-events: none; /* No interfieren con los clics */
        }

        @keyframes nadar {
            0% { top: 10%; left: 0%; transform: translateX(0) scaleX(1); opacity: 0; }
            10% { opacity: 1; }
            40% { top: 60%; left: 70%; }
            60% { top: 20%; left: 30%; transform: translateX(0) scaleX(-1); } /* Giran a la izquierda */
            80% { top: 80%; left: 90%; }
            100% { top: 10%; left: 0%; opacity: 0; }
        }

        /* ESTILO PARA EL MENSAJE FINAL EXTRA */
        #mensaje-final-extra {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.1); /* Fondo transparente para que se vea el neón */
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: #ffffff; 
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff007f, 0 0 40px #ff007f, 0 0 60px #ff007f;
            font-size: 1.8rem; /* Tamaño de letra grande para el mensaje */
            line-height: 1.5;
            opacity: 0; /* Empieza invisible */
            transition: opacity 2s ease-in-out; /* Transición suave */
            z-index: 30; /* Encima de todo */
            display: none; /* Se oculta por defecto */
        }
        #mensaje-final-extra.mostrar {
            opacity: 1;
            display: block;
        }
    </style>
</head>
<body>

    <div id="mensaje-central">precionelooooo amorrrr 💘</div>
    
    <div id="corazon-movil">💘</div>
    
    <div id="centro-pantalla"></div>

    <div id="mensaje-final-extra">
        AMOR ESTE AÑO HA SIDO LO MEJOR QUE ME HA PASADO POR CONOCERLA. 
        PERDÓN POR MIS ACTITUDES, ES LA MEJOR EN TODO, GRACIAS POR SOPORTARME, 
        SE LO AGRADEZCO. ES Y SIEMPRE VA A SER MI ESPOSITA DE MIS SUEÑOS. 
        ES LA MEJORRRRRRRR MIBEBITAAA
    </div>

    <script>
        const textos = [
            "amorrrrrrrrrrrrrrr la amo es la mejor",
            "y como no tiene idea por lo presiosaaa que es",
            "amor en verdad que quiero que estemos juntos de por vida es mi sueño cumplido amo cada parte de ustedd",
            "amor la amooooooooooo mi pequeñita"
        ];
        
        let paso = 0;
        const botonCorazon = document.getElementById('corazon-movil');
        const cajaMensaje = document.getElementById('mensaje-central');
        const contenedorCentro = document.getElementById('centro-pantalla');
        const mensajeFinalExtra = document.getElementById('mensaje-final-extra');

        // Función para crear tiburones aleatorios
        function crearTiburon() {
            const tiburon = document.createElement('div');
            tiburon.className = 'tiburon-neon';
            tiburon.innerText = '🦈';
            // Posición inicial aleatoria
            tiburon.style.top = `${Math.random() * 100}vh`;
            tiburon.style.left = `${Math.random() * 100}vw`;
            // Animación con retraso y duración aleatoria
            tiburon.style.animationDelay = `${Math.random() * 10}s`;
            tiburon.style.animationDuration = `${10 + Math.random() * 10}s`;
            document.body.appendChild(tiburon);

            // Eliminar tiburones viejos para no sobrecargar
            setTimeout(() => {
                tiburon.remove();
            }, (10 + Math.random() * 10) * 1000); // Duración de la animación en ms
        }

        // Crear varios tiburones desde el inicio y seguir creándolos
        for (let i = 0; i < 5; i++) {
            crearTiburon();
        }
        setInterval(crearTiburon, 3000); // Crear un nuevo tiburón cada 3 segundos

        botonCorazon.addEventListener('click', () => {
            if (paso < textos.length) {
                cajaMensaje.innerText = textos[paso];
                paso++;
            } else {
                cajaMensaje.style.display = 'none';
                botonCorazon.style.display = 'none';
                dibujarCorazonFinal();
                
                // Mostrar el mensaje final extra después de un pequeño retraso
                setTimeout(() => {
                    mensajeFinalExtra.classList.add('mostrar');
                }, 1500); // 1.5 segundos después de que aparece el corazón final
            }
        });

        function dibujarCorazonFinal() {
            const cantidadPalabras = 35; 
            const tamaño = window.innerWidth < 600 ? 10 : 15; 

            for (let i = 0; i < cantidadPalabras; i++) {
                const t = i * (Math.PI * 2) / cantidadPalabras;
                
                // Fórmula del corazón
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                
                const posX = x * tamaño;
                const posY = -y * tamaño; 

                const palabra = document.createElement('div');
                palabra.className = 'palabra-amor';
                palabra.innerText = 'la amo';
                
                palabra.style.left = `${posX}px`;
                palabra.style.top = `${posY}px`;
                palabra.style.animationDelay = `${(i * 0.1)}s`; 
                
                contenedorCentro.appendChild(palabra);
            }
        }
    </script>
</body>
</html>
